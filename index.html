<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cementerio General de Guacotecti</title>
<style>
:root{
  --bg:#E9EEF5; --surface:#FFFFFF; --sunk:#EEF2F8; --ink:#1C2236; --muted:#566079; --line:#D3DAE6;
  --accent:#2F5D99; --accent-soft:#E1EAF6; --accent-ink:#FFFFFF;
  --navy:#252D48; --navy-2:#1B2238; --gold:#D4B65C; --gold-ink:#1C2236; --on-navy:#FFFFFF; --on-navy-muted:#C3CBDD;
  --warn:#9A5E14; --warn-soft:#F6E8D2; --danger:#A23B2A; --danger-soft:#F5DDD8; --ok:#2F6B4C; --ok-soft:#DDEDE3;
  --shadow:0 18px 50px rgba(22,30,58,.24);
  --sans:"Segoe UI",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:Cambria,Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121726; --surface:#1A2135; --sunk:#161C2D; --ink:#E6EAF2; --muted:#9AA5BA; --line:#2A3350;
    --accent:#8FB3E8; --accent-soft:#1F2E4D; --accent-ink:#0E1424;
    --navy:#0F1424; --navy-2:#0A0E1A; --gold:#D9BE6A; --gold-ink:#141A2A; --on-navy:#F1F4FA; --on-navy-muted:#A9B3C8;
    --warn:#E3A95C; --warn-soft:#3A2D1A; --danger:#E6826F; --danger-soft:#3D221D; --ok:#86C7A2; --ok-soft:#1E3327;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#121726; --surface:#1A2135; --sunk:#161C2D; --ink:#E6EAF2; --muted:#9AA5BA; --line:#2A3350;
  --accent:#8FB3E8; --accent-soft:#1F2E4D; --accent-ink:#0E1424;
  --navy:#0F1424; --navy-2:#0A0E1A; --gold:#D9BE6A; --gold-ink:#141A2A; --on-navy:#F1F4FA; --on-navy-muted:#A9B3C8;
  --warn:#E3A95C; --warn-soft:#3A2D1A; --danger:#E6826F; --danger-soft:#3D221D; --ok:#86C7A2; --ok-soft:#1E3327;
  --shadow:0 18px 50px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

/* Encabezado */
header.top{padding:16px 0 18px;border-bottom:3px solid var(--gold);background:linear-gradient(180deg,#2E3757 0%,var(--navy) 55%,var(--navy-2) 100%);color:var(--on-navy)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand-logo{width:64px;height:64px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand{flex:1;min-width:240px}
.brand h1{font:600 24px/1.15 var(--serif);margin:0;letter-spacing:.02em;color:var(--gold)}
.brand p{margin:4px 0 0;color:var(--on-navy-muted);font-size:14px}
.top .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:var(--on-navy)}
.top .btn:hover{background:rgba(255,255,255,.16)}
.top .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.top .btn.primary:hover{filter:brightness(1.07)}
.top :focus-visible{outline-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

/* Búsqueda */
.finder{padding:22px 0 8px}
.search{position:relative}
.search input{width:100%;font-size:19px;padding:16px 18px 16px 52px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:12px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters .spacer{flex:1}

.summary{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip b{font-weight:600}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.static{cursor:default}

/* Tabla */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0}
.tablebox>table>thead th{background:#2F5D99;color:#fff;border-bottom:0}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.num{font-weight:600;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
td.clip{max-width:240px}
td.clip span.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.none{color:var(--muted);font-weight:400;padding-left:0}
mark{background:color-mix(in srgb,var(--warn) 28%,transparent);color:inherit;border-radius:2px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 40px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.pager .btns{display:flex;gap:6px}

.status{padding:60px 20px;text-align:center;color:var(--muted)}

/* Tarjetas en móvil */
.cards{display:none}
@media (max-width:720px){
  .tablebox{display:none}
  .cards{display:grid;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  .card .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .card .name{font-weight:600}
  .card .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .brand h1{font-size:20px}
  .brand-logo{width:52px;height:52px}
  .search input{font-size:17px}
  .search kbd{display:none}
}

/* Ventanas emergentes */
.overlay{position:fixed;inset:0;background:rgba(15,22,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-y:auto;z-index:50;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:880px;animation:rise .18s ease;border:1px solid var(--line)}
.modal.small{max-width:440px}
.modal-head{display:flex;gap:16px;align-items:flex-start;padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.modal-head .ttl{flex:1;min-width:0}
.modal-head h2{margin:0;font:600 24px/1.2 var(--serif);overflow-wrap:anywhere}
.modal-head .kicker{color:var(--muted);font-size:13.5px;margin-bottom:4px}
.modal-body{padding:20px 24px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 24px 20px;border-top:1px solid var(--line)}
.modal-foot .left{margin-right:auto}
.x{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.x svg{width:20px;height:20px;display:block}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.overlay,.modal{animation:none}}

.titlenum{font:600 13px var(--sans);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 10px;display:inline-block;white-space:nowrap}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sec{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg)}
.sec.wide{grid-column:1/-1}
.sec h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--accent)}
.sec dl{margin:0;display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:6px 12px;font-size:14px}
.sec dt{color:var(--muted)}
.sec dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.sec .none{color:var(--muted);font-size:14px;margin:0}
.related{margin-top:14px;font-size:14px}
.related a{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media (max-width:720px){.sections{grid-template-columns:1fr}.modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px}}

/* Formulario */
form fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 16px 16px;margin:0 0 14px}
form legend{font-weight:600;color:var(--accent);font-size:14px;padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field .req{color:var(--danger)}
.field.err input{border-color:var(--danger)}
.field .msg{color:var(--danger);font-size:12.5px;margin-top:3px}
@media (max-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.grid{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:90;box-shadow:var(--shadow)}
/* Pestañas */
.top .tabs{display:flex;gap:4px;margin-top:14px;margin-bottom:-19px;align-items:stretch}
.tab{border:0;background:transparent;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--on-navy-muted)}
.tab[aria-selected="true"]{color:var(--on-navy);border-bottom-color:var(--gold)}
.tab:hover{color:var(--on-navy)}

/* Reportes */
.rep-controls{padding:22px 0 6px;display:grid;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);justify-self:start}
.seg-b{border:0;background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg-b[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rep-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rep-row label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rep-row select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.rep-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rep-actions .spacer{flex:1}
.rep-hint{margin:4px 2px 12px}
.paper-wrap{overflow-x:auto;padding-bottom:6px}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:28px 28px 34px;min-width:720px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rep-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:12px 2px 40px}
.rep-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid #c9ccc8;display:inline-block}
.sw.auto{background:#fff}.sw.man{background:#FFF7DC}.sw.adj{background:#E3EEF8}

/* Documento del reporte (pantalla e impresión) */
.doc{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#000;font-variant-numeric:tabular-nums}
.doc-head{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px;border:2px solid #000;border-bottom:0;padding:10px 12px}
.doc-head img{width:92px;height:auto;display:block;justify-self:center}
.doc-head .lines{text-align:center;font-weight:700;font-size:15px;line-height:1.35;text-transform:uppercase}
.doc table{width:100%;min-width:0;border-collapse:collapse;font-size:14.5px}
.doc th{position:static;background:transparent;color:#000;font-size:14.5px;font-weight:700;text-align:center;border:2px solid #000;padding:8px 6px;text-transform:uppercase}
.doc td{border:1px solid #000;padding:6px 8px;font-size:14.5px;vertical-align:middle;cursor:default}
.doc tbody tr{cursor:default}
.doc tbody tr:hover{background:transparent}
.doc td.dist{text-align:center;color:#C00000;border-left:2px solid #000;border-right:2px solid #000;border-bottom:2px solid #000}
.doc td.n{text-align:center;white-space:nowrap}
.doc table{table-layout:fixed}
.doc td:nth-child(2){overflow-wrap:anywhere}
.doc td.tot{font-weight:700}
.doc tr:last-child td{border-bottom:2px solid #000}
.doc td.n:last-child{border-right:2px solid #000}
.doc .cell-auto{cursor:pointer}
.doc .cell-auto:hover{background:#EAF0F8;outline:1px solid #2F5D99;outline-offset:-2px}
.doc .cell-adj{background:#E3EEF8}
.doc .cell-man{background:#FFF7DC;padding:0}
.doc .cell-man input{width:100%;border:0;background:transparent;text-align:center;font:inherit;padding:6px 4px;color:#000}
.doc .cell-man input:focus{outline:2px solid #2F5D99;outline-offset:-2px;background:#fff}
.doc .cell-man.ro{padding:6px 8px}
.doc tfoot td{font-weight:700;border-top:2px solid #000}
.cellmeta{font-size:12.5px;color:var(--muted)}
.rec-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;max-height:46vh;overflow:auto}
.rec-list li{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.rec-list li:last-child{border-bottom:0}
.rec-list li:hover{background:var(--accent-soft)}
.rec-list .why{color:var(--muted);font-size:13px;white-space:nowrap}
.adj-box{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.adj-box .field{flex:1;min-width:180px}
.rowcfg{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.rowcfg input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rowcfg .src{font-size:12px;color:var(--muted);white-space:nowrap}
.rowcfg .mv{display:flex;gap:2px}
.rowcfg .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:28px;cursor:pointer;padding:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  html,body{background:#fff!important}
  body{margin:0}
  .doc .cell-adj,.doc .cell-man{background:transparent!important}
}
@media (max-width:720px){.paper{padding:16px}}

/* Prórroga y estado de cuenta */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.stepper{display:flex;gap:6px;align-items:center}
.stepper input{width:90px;text-align:center;font-size:20px;font-weight:600;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stepper .btn{width:42px;justify-content:center;font-size:18px;padding:8px 0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.quick button:hover{background:var(--accent-soft)}
.calc-out{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.calc-total{font:600 30px/1.1 var(--serif);color:var(--accent)}
@media (max-width:620px){.calc{grid-template-columns:1fr}}
.hist{margin-top:14px}
.hist-h{font-weight:600;font-size:13.5px;margin-bottom:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.mini{min-width:560px;font-size:13.5px}
table.mini th{position:static;font-size:12px;padding:7px 10px}
table.mini td{padding:7px 10px;font-size:13.5px}
table.mini tbody tr{cursor:default}
table.mini tbody tr:hover{background:transparent}
table.mini tr.nota td{color:var(--muted);font-size:12.5px;padding-top:0;border-top:0}
.linkbtn{border:0;background:none;color:var(--danger);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0}
.ec-paper{min-width:640px;padding:22px 26px}
.doc.ec .doc-head{border-bottom:2px solid #000;padding:6px 12px;grid-template-columns:90px 1fr 90px}
.doc.ec .doc-head img{width:74px}
.doc.ec table.kv{table-layout:fixed}
.doc.ec .lines .big{font-size:18px;margin-top:2px}
.doc.ec .lines .sm{font-size:12.5px;font-weight:400;text-transform:none}
.ec-body{border:2px solid #000;border-top:0;padding:6px 16px 16px;font-size:13.5px}
.ec-body h4{font-size:12.5px;text-transform:uppercase;margin:12px 0 5px;letter-spacing:.02em}
.ec-body p{margin:6px 0}
.ec-body .sm{font-size:11.5px;color:#444}
.doc.ec table{table-layout:auto;font-size:13px}
.doc.ec table.kv{margin-top:-1px}
.doc.ec table.kv th{position:static;background:#f4f4f4;text-transform:none;text-align:left;font-weight:600;border:1px solid #000;padding:3px 7px;font-size:12.5px;vertical-align:top}
.doc.ec table.kv td{border:1px solid #000;padding:3px 7px;font-size:12.5px;white-space:pre-wrap}
.doc.ec table.grid-t th{position:static;background:#f0f0f0;font-size:12px;border:1px solid #000;padding:5px 6px;text-transform:none}
.doc.ec table.grid-t td{border:1px solid #000;padding:3px 6px;font-size:12px;text-align:center}
.doc.ec table.grid-t td.r{text-align:right;white-space:nowrap}
.doc.ec table.grid-t tr.tot td{font-weight:700;border-top:2px solid #000}
.doc.ec tr{break-inside:avoid}
.doc.ec h4{break-after:avoid}
.doc.ec .saldo,.doc.ec .firmas{break-inside:avoid}
.doc.ec tr:last-child td{border-bottom:1px solid #000}
.doc.ec td:nth-child(2){overflow-wrap:normal}
.doc.ec .saldo{margin:14px 0 4px;border:2px solid #000;padding:10px 14px;font-size:15px;text-align:center}
.doc.ec .saldo.debe{background:#fbeaea}
.doc.ec .firmas{display:flex;justify-content:space-around;gap:30px;margin:34px 0 6px;font-size:12.5px;text-align:center}

<script>
(function(){
'use strict';
/* ---------- Definición de campos ---------- */
const SECTIONS=[
  {id:'titulo',t:'Datos del título',f:[['noTitulo','No. de título / espacio'],['fechaEmision','Fecha de emisión','date'],['anio','Año'],['mes','Mes'],['ampo','No. de ampo'],['montoTitulo','Pago del título ($)','money','titulo'],['recibo','Recibo No. del título']]},
  {id:'titular',t:'Titular',f:[['titular','Nombre del titular','text',true],['dui','DUI del titular'],['telefono','Teléfono'],['beneficiarios','Beneficiarios','area']]},
  {id:'espacio',t:'Espacio',f:[['sector','Sector / cuadro'],['fila','Fila / calle'],['medidas','Medidas'],['ubicacionNotas','Referencia de ubicación','area']]},
  {id:'enterramientos',t:'Enterramiento',f:[['sepultados','Persona(s) sepultada(s)','area'],['fechaEnterramiento','Fecha de enterramiento','date'],['montoEnterramiento','Pago de enterramiento ($)','money','enterramiento'],['reciboEnterramiento','Recibo No. de pago de enterramiento']]},
  {id:'sobreboveda',t:'Enterramiento sobre bóveda',f:[['personaEnterradaSobre','Persona enterrada sobre bóveda','area'],['fechaEnterramiento2','Fecha de enterramiento','date'],['fechaPagoEnterramiento2','Fecha de pago','date'],['montoEnterramiento2','Pago de enterramiento ($)','money','enterramiento'],['reciboEnterramiento2','Recibo No. de pago de enterramiento sobre bóveda']]},
  {id:'prorroga',t:'Prórroga',f:[['inicioPeriodos','Inicio de períodos (solo si es distinto a la fecha de enterramiento)','date'],['noAplicaProrroga','Este título no paga prórroga','check'],['notaProrroga','Notas de prórroga','area']]},
  {id:'construccion',t:'Permiso de construcción',f:[['construyoBoveda','Construyó bóvedas'],['fechaPagoConstruccion','Fecha de pago','date'],['montoConstruccion','Pago del permiso ($)','money','construccion'],['reciboConstruccion','Recibo No. del permiso'],['noConstruyo','No construyó']]},
  {id:'bovedas',t:'Permiso de construcción sobre bóveda',f:[['bovedaSobre','Construyó bóveda sobre otra'],['fechaPagoBovedaSobre','Fecha de pago','date'],['montoBovedaSobre','Pago del permiso ($)','money','construccionSobre'],['reciboBovedaSobre','Recibo No. del permiso'],['unaSobreOtra','Construyó una sobre otra'],['fechaPagoUnaSobreOtra','Fecha que canceló (una sobre otra)','date']]},
  {id:'reparacion',t:'Reparación de bóveda',f:[['reparacion','Reparación de bóveda'],['fechaReparacion','Fecha de reparación','date'],['montoReparacion','Pago de reparación ($)','money','reparacion'],['reciboReparacion','Recibo No. de reparación']]},
  {id:'usoservicios',t:'Permiso de uso de servicios',f:[['servicios','Servicios (agua, etc.)','area'],['fechaPagoServicios','Fecha de pago','date'],['montoServicios','Pago del permiso ($)','money','usoServicios'],['reciboServicios','Recibo No. del permiso']]},
  {id:'obs',t:'Observaciones',f:[['observaciones','Observaciones','area'],['notaExtra','Nota adicional','area']]}
];
/* ---------- Tarifas ---------- */
const TARIFAS_DEF=[
  ['titulo','Pago de título',31],
  ['prorroga','Prórroga (por período)',7.35],
  ['construccion','Permiso de construcción',21],
  ['construccionSobre','Permiso de construcción sobre bóveda',21],
  ['enterramiento','Enterramiento',5.25],
  ['reparacion','Reparación de bóveda',21],
  ['usoServicios','Permiso de uso de servicios',5.25]
];
function tarifa(k){
  if(k==='prorroga') return prCfg().precio;
  const t=(typeof REP!=='undefined'&&REP&&REP.tarifas)||{}; const v=parseFloat(t[k]);
  if(v>=0) return v; const d=TARIFAS_DEF.find(x=>x[0]===k); return d?d[2]:0;
}
const fmtMonto=n=>(Math.round(n*100)/100).toFixed(2);
const ALL_FIELDS=SECTIONS.flatMap(s=>s.f);
const DATE_FIELDS=new Set(ALL_FIELDS.filter(f=>f[2]==='date').map(f=>f[0]));
const MONEY_FIELDS=ALL_FIELDS.filter(f=>f[2]==='money');
const MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const PAGE=50;

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const isISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const fmtDate=s=>isISO(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):(s||'');
function toISO(s){
  s=(s||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){const d=+m[1],mo=+m[2];if(d>=1&&d<=31&&mo>=1&&mo<=12)return m[3]+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  if(isISO(s)) return s;
  return s;
}
function parseAnyDate(s){
  if(!s) return null;
  if(isISO(s)) return new Date(s+'T00:00:00');
  const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  return null;
}
const today=new Date(); today.setHours(0,0,0,0);
const espacioTxt=r=>[r.sector&&('Sector '+r.sector),r.fila&&('Fila '+r.fila)].filter(Boolean).join(' · ');
function hl(text,terms){
  let s=esc(text); if(!terms.length||!text) return s;
  const src=fold(text); const marks=[];
  terms.forEach(t=>{let i=0;while(t&&(i=src.indexOf(t,i))>-1){marks.push([i,i+t.length]);i+=t.length;}});
  if(!marks.length) return s;
  marks.sort((a,b)=>a[0]-b[0]); const merged=[];
  marks.forEach(m=>{const l=merged[merged.length-1];if(l&&m[0]<=l[1])l[1]=Math.max(l[1],m[1]);else merged.push(m.slice());});
  let out='',p=0; const raw=String(text);
  merged.forEach(([a,b])=>{out+=esc(raw.slice(p,a))+'<mark>'+esc(raw.slice(a,b))+'</mark>';p=b;});
  return out+esc(raw.slice(p));
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
const ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>';

/* ---------- Estado ---------- */
let DB=null, canWrite=false, downloads=null;
let records=[]; let byId=new Map();
let filtered=[]; let page=0;
const st={q:'',anio:'',ampo:'',estado:'',orden:'fecha-desc'};

/* ---------- Ventanas emergentes ---------- */
const stack=[];
function openModal(html,{small=false,onClose}={}){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML='<div class="modal'+(small?' small':'')+'" role="dialog" aria-modal="true">'+html+'</div>';
  ov.addEventListener('mousedown',e=>{if(e.target===ov) closeTop();});
  ov.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeTop));
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  const entry={ov,onClose,prevFocus:document.activeElement}; stack.push(entry);
  setTimeout(()=>{const f=ov.querySelector('[autofocus]')||ov.querySelector('input,textarea,button');f&&f.focus();},30);
  return ov;
}
function closeTop(){
  const e=stack.pop(); if(!e) return;
  e.ov.remove(); e.onClose&&e.onClose();
  if(!stack.length) document.body.style.overflow='';
  e.prevFocus&&e.prevFocus.focus&&e.prevFocus.focus();
}
function confirmBox(title,text,okLabel,danger){
  return new Promise(res=>{
    let done=false;
    const ov=openModal('<div class="modal-head"><div class="ttl"><h2 style="font-size:20px">'+esc(title)+'</h2></div></div><div class="modal-body">'+text+'</div><div class="modal-foot"><button class="btn" data-no type="button">Cancelar</button><button class="btn '+(danger?'danger solid':'primary')+'" data-yes type="button" autofocus>'+esc(okLabel)+'</button></div>',{small:true,onClose:()=>{if(!done)res(false);}});
    ov.querySelector('[data-no]').onclick=()=>closeTop();
    ov.querySelector('[data-yes]').onclick=()=>{done=true;closeTop();res(true);};
  });
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&stack.length){e.preventDefault();closeTop();return;}
  if(e.key==='/'&&!stack.length&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}
});

/* ---------- Carga de datos ---------- */
function ingest(){
  migrateAll();
  const list=[];
  {
    for(const id in STORE){
      const r=STORE[id]; if(!r||typeof r!=='object') continue;
      const rec=Object.assign({},r,{id,_c:''});
      rec._s=fold([rec.noTitulo,rec.titular,rec.dui,rec.telefono,rec.beneficiarios,rec.sepultados,rec.personaEnterradaSobre,rec.recibo,rec.observaciones,rec.reciboEnterramiento,rec.reciboEnterramiento2,rec.reciboConstruccion,rec.reciboBovedaSobre,rec.reciboServicios,rec.ampo,rec.sector,rec.fila,rec.servicios,rec.reciboReparacion,rec.reciboProrroga,(rec.pagosProrroga||[]).map(x=>x.recibo).join(' ')].join(' | '));
      rec._t=(rec.noTitulo||'').replace(/^0+/,'');
      rec._p=computeProrroga(rec);
      list.push(rec);
    }
  }
  records=list; byId=new Map(list.map(r=>[r.id,r]));
  fillFilterOptions(); apply(false);
  if(typeof repInvalidate==='function') repInvalidate();
  $('#status').hidden=!!records.length;
  if(!records.length) $('#status').innerHTML='<strong style="color:var(--ink)">Todavía no hay títulos registrados.</strong><br>Use “Nuevo título” para agregar el primero.';
}
function fillFilterOptions(){
  const years=[...new Set(records.map(r=>r.anio).filter(Boolean))].sort().reverse();
  const ampos=[...new Set(records.map(r=>r.ampo).filter(a=>a&&a!=='AMPO'))].sort();
  const sA=$('#fAnio'),sB=$('#fAmpo');
  const keepA=sA.value,keepB=sB.value;
  sA.innerHTML='<option value="">Todos</option>'+years.map(y=>'<option>'+esc(y)+'</option>').join('');
  sB.innerHTML='<option value="">Todos</option>'+ampos.map(a=>'<option>'+esc(a)+'</option>').join('')+'<option value="__none">Sin ampo</option>';
  sA.value=keepA; sB.value=keepB;
}

/* ---------- Filtrado y listado ---------- */
function apply(resetPage=true){
  const terms=fold(st.q).split(/\s+/).filter(Boolean);
  filtered=records.filter(r=>{
    if(st.anio&&r.anio!==st.anio) return false;
    if(st.ampo){ if(st.ampo==='__none'){ if(r.ampo&&r.ampo!=='AMPO') return false; } else if(r.ampo!==st.ampo) return false; }
    if(st.estado){
      const k=r._p&&r._p.k;
      if(st.estado==='sepultados'&&!r.sepultados) return false;
      if(['vencido','pendiente','porvencer','aldia','sininicio'].includes(st.estado)&&k!==st.estado) return false;
      if(st.estado==='consaldo'&&!(r._p&&r._p.saldo>0)) return false;
    }
    for(const t of terms) if(r._s.indexOf(t)<0) return false;
    return true;
  });
  const o=st.orden;
  const fd=r=>isISO(r.fechaEmision)?r.fechaEmision:(r.anio?r.anio+'-00':'');
  filtered.sort((a,b)=>{
    if(o==='titular') return (a.titular||'').localeCompare(b.titular||'','es');
    if(o==='titulo') return (a._t.padStart(12,'0')).localeCompare(b._t.padStart(12,'0'));
    if(o==='saldo') return ((b._p&&b._p.saldo)||0)-((a._p&&a._p.saldo)||0)||(a._t.padStart(12,'0')).localeCompare(b._t.padStart(12,'0'));
    const c=fd(a).localeCompare(fd(b)); return o==='fecha-asc'?c:-c;
  });
  if(resetPage) page=0;
  const maxPage=Math.max(0,Math.ceil(filtered.length/PAGE)-1); if(page>maxPage) page=maxPage;
  $('#btnClear').hidden=!(st.q||st.anio||st.ampo||st.estado);
  render(terms);
}
function render(terms){
  // Resumen
  const total=records.length, cnt=k=>records.filter(r=>r._p&&r._p.k===k).length;
  const venc=cnt('vencido'), pend=cnt('pendiente'), pv=cnt('porvencer'), revisar=cnt('sininicio');
  const deuda=records.reduce((s,r)=>s+((r._p&&r._p.saldo)||0),0);
  const isFiltered=st.q||st.anio||st.ampo||st.estado;
  $('#summary').innerHTML=
    '<span class="chip static"><b>'+total.toLocaleString('es-SV')+'</b> títulos registrados</span>'+
    (isFiltered?'<span class="chip static"><b>'+filtered.length.toLocaleString('es-SV')+'</b> coinciden</span>':'')+
    (venc?'<button type="button" class="chip danger" data-est="vencido"><b>'+venc+'</b> vencidos</button>':'')+
    (pend?'<button type="button" class="chip warn" data-est="pendiente"><b>'+pend+'</b> pendientes de pago</button>':'')+
    (pv?'<button type="button" class="chip warn" data-est="porvencer"><b>'+pv+'</b> por vencer</button>':'')+
    (deuda?'<button type="button" class="chip" data-est="consaldo" data-ord="saldo"><b>'+money(deuda)+'</b> por cobrar en prórrogas</button>':'')+
    (revisar?'<button type="button" class="chip" data-est="sininicio"><b>'+revisar+'</b> sin fecha de inicio</button>':'');
  $('#summary').querySelectorAll('[data-est]').forEach(b=>b.onclick=()=>{st.estado=b.dataset.est;$('#fEstado').value=st.estado;if(b.dataset.ord||b.dataset.est==='vencido'||b.dataset.est==='pendiente'){st.orden='saldo';$('#fOrden').value='saldo';}apply();});

  const rows=filtered.slice(page*PAGE,page*PAGE+PAGE);
  const box=$('#tablebox'),cards=$('#cards'),pager=$('#pager');
  if(!records.length){box.hidden=true;cards.innerHTML='';pager.hidden=true;return;}
  box.hidden=false;
  if(!filtered.length){
    $('#tbody').innerHTML='<tr><td colspan="7"><div class="empty"><strong>No hay títulos que coincidan.</strong>Revise la ortografía, pruebe con menos palabras o limpie los filtros.</div></td></tr>';
    cards.innerHTML='<div class="empty"><strong>No hay títulos que coincidan.</strong>Revise la ortografía o limpie los filtros.</div>';
    pager.hidden=true; return;
  }
  const badge=r=>prBadge(r._p);
  $('#tbody').innerHTML=rows.map(r=>'<tr data-id="'+esc(r.id)+'" tabindex="0">'+
    '<td class="num">'+hl(r.noTitulo||'—',terms)+(espacioTxt(r)?'<span class="sub">'+hl(espacioTxt(r),terms)+'</span>':'')+'</td>'+
    '<td><strong style="font-weight:600">'+hl(r.titular,terms)+'</strong>'+(r.dui?'<span class="sub">DUI '+hl(r.dui,terms)+'</span>':'')+'</td>'+
    '<td style="white-space:nowrap">'+esc(fmtDate(r.fechaEmision)||r.anio||'—')+'</td>'+
    '<td style="white-space:nowrap">'+esc(r.ampo||'—')+'</td>'+
    '<td class="clip"><span class="t">'+(r.beneficiarios?hl(r.beneficiarios,terms):'<span style="color:var(--muted)">—</span>')+'</span></td>'+
    '<td class="clip"><span class="t">'+(r.sepultados?hl(r.sepultados,terms):'<span style="color:var(--muted)">—</span>')+'</span></td>'+
    '<td>'+badge(r)+'</td></tr>').join('');
  cards.innerHTML=rows.map(r=>'<div class="card" data-id="'+esc(r.id)+'" tabindex="0"><div class="row1"><span class="name">'+hl(r.titular,terms)+'</span><span class="titlenum">'+hl(r.noTitulo||'—',terms)+'</span></div>'+
    '<div class="meta">'+esc(fmtDate(r.fechaEmision)||r.anio||'')+(r.ampo?' · '+esc(r.ampo):'')+(r.sepultados?'<br>Sepultado(s): '+hl(r.sepultados,terms):'')+'</div>'+
    (r._p&&PR_BADGE[r._p.k]?'<div style="margin-top:6px">'+badge(r)+'</div>':'')+'</div>').join('');
  document.querySelectorAll('[data-id]').forEach(el=>{
    el.onclick=()=>showDetail(el.dataset.id);
    el.onkeydown=e=>{if(e.key==='Enter')showDetail(el.dataset.id);};
  });
  const pages=Math.ceil(filtered.length/PAGE);
  pager.hidden=false;
  pager.innerHTML='<span>Mostrando '+(page*PAGE+1)+'–'+Math.min(filtered.length,(page+1)*PAGE)+' de '+filtered.length.toLocaleString('es-SV')+'</span>'+
    (pages>1?'<span class="btns"><button class="btn" id="pPrev" type="button"'+(page===0?' disabled':'')+'>Anterior</button><span style="align-self:center;padding:0 6px">Página '+(page+1)+' de '+pages+'</span><button class="btn" id="pNext" type="button"'+(page>=pages-1?' disabled':'')+'>Siguiente</button></span>':'');
  const go=d=>{page+=d;render(terms);window.scrollTo({top:$('.finder').offsetTop,behavior:'smooth'});};
  if($('#pPrev')) $('#pPrev').onclick=()=>go(-1);
  if($('#pNext')) $('#pNext').onclick=()=>go(1);
}

/* ---------- Ficha del título (ventana) ---------- */
function showDetail(id){
  const r=byId.get(id); if(!r) return;
  const secs=SECTIONS.map(s=>{
    if(s.id==='prorroga') return prDetailHtml(r);
    let items=s.f.filter(([k,,type])=>r[k]&&type!=='check').map(([k,l,type])=>'<dt>'+esc(l)+'</dt><dd>'+esc(DATE_FIELDS.has(k)?fmtDate(r[k]):type==='money'&&/^\d+(\.\d+)?$/.test(r[k])?'$'+fmtMonto(+r[k]):r[k])+'</dd>').join('');
    if(s.id==='espacio') items='<dt>No. de espacio</dt><dd><b>'+esc(r.noTitulo||'s/n')+'</b> <span class="cellmeta">(igual al No. de título)</span></dd>'+items;
    if(!items) return '';
    const wide=(s.id==='obs');
    return '<section class="sec'+(wide?' wide':'')+'"><h3>'+esc(s.t)+'</h3><dl>'+items+'</dl></section>';
  }).join('');
  const p=r._p;
  const pNote=p&&PR_BADGE[p.k]?'<span style="margin-left:8px">'+prBadge(p,true)+'</span>':'';
  // relacionados: mismo No. de título o mismo titular
  const nt=r._t, tn=fold(r.titular).trim();
  const rel=records.filter(x=>x.id!==r.id&&((nt&&x._t===nt)||(tn&&fold(x.titular).trim()===tn)));
  const relHtml=rel.length?'<div class="related"><strong>Otros registros relacionados:</strong> '+rel.slice(0,8).map(x=>'<a data-rel="'+esc(x.id)+'">'+esc((x.noTitulo||'s/n')+' · '+(x.titular||'')+(x.fechaEmision?' ('+fmtDate(x.fechaEmision)+')':''))+'</a>').join(', ')+'</div>':'';
  const origin=r.filaExcel?'Importado del Excel, fila '+r.filaExcel:'Registrado en el sistema';
  const mod=r.modificado?' · Última modificación '+new Date(r.modificado).toLocaleString('es-SV')+(r.modificadoPor?' por '+r.modificadoPor:''):'';
  const ov=openModal(
    '<div class="modal-head"><div class="ttl"><div class="kicker"><span class="titlenum">Título / espacio No. '+esc(r.noTitulo||'s/n')+'</span>'+pNote+'</div><h2>'+esc(r.titular||'(sin titular)')+'</h2><div class="kicker" style="margin:6px 0 0">'+esc(origin+mod)+'</div></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<div class="modal-body"><div class="sections">'+secs+'</div>'+relHtml+(canWrite?'':'<div class="ro-note">Tiene acceso de solo lectura; no puede modificar este título.</div>')+'</div>'+
    '<div class="modal-foot">'+(canWrite?'<button class="btn danger left" data-del type="button">Eliminar</button>':'')+'<button class="btn" data-ec type="button">Estado de cuenta</button>'+(canWrite&&p&&p.k!=='noaplica'&&p.k!=='sinent'?'<button class="btn" data-cobrar type="button">Cobrar prórroga</button>':'')+(canWrite?'<button class="btn primary" data-edit type="button">Editar título</button>':'')+'</div>');
  ov.querySelector('[data-ec]').onclick=()=>estadoCuenta(r);
  const cb=ov.querySelector('[data-cobrar]'); if(cb) cb.onclick=()=>{closeTop();cobrarProrroga(r);};
  ov.querySelectorAll('[data-delpago]').forEach(b=>b.onclick=()=>borrarPagoProrroga(r,b.dataset.delpago));
  ov.querySelectorAll('[data-rel]').forEach(a=>a.onclick=()=>{closeTop();showDetail(a.dataset.rel);});
  const eb=ov.querySelector('[data-edit]'); if(eb) eb.onclick=()=>{closeTop();showForm(r);};
  const db=ov.querySelector('[data-del]'); if(db) db.onclick=()=>deleteRec(r);
}

/* ---------- Formulario nuevo/editar (ventana) ---------- */
function showForm(r){
  const isNew=!r; r=r||{};
  const fs=SECTIONS.map(s=>'<fieldset><legend>'+esc(s.t)+'</legend><div class="grid">'+s.f.map(function([k,l,type,req]){
    const v=DATE_FIELDS.has(k)?fmtDate(r[k]||''):(r[k]||'');
    const full=type==='area'||type==='check'||k==='titular';
    if(type==='money'){ const tf=tarifa(req); return '<div class="field"><label for="f_'+k+'">'+esc(l)+'</label><div class="money-in"><input name="'+k+'" id="f_'+k+'" value="'+esc(v)+'" inputmode="decimal" autocomplete="off" placeholder="'+fmtMonto(tf)+'"><button type="button" class="tarifa-b" data-tarifa="'+k+'" data-v="'+fmtMonto(tf)+'" title="Usar la tarifa">$'+fmtMonto(tf)+'</button></div></div>'; }
    if(type==='check') return '<div class="field full"><label class="chk"><input type="checkbox" name="'+k+'" id="f_'+k+'"'+(r[k]?' checked':'')+'> '+esc(l)+'</label></div>';
    const input=type==='area'?'<textarea name="'+k+'" id="f_'+k+'">'+esc(v)+'</textarea>':'<input name="'+k+'" id="f_'+k+'" value="'+esc(v)+'"'+(type==='date'?' placeholder="dd/mm/aaaa"':'')+(k==='titular'?' autofocus':'')+' autocomplete="off">';
    return '<div class="field'+(full?' full':'')+'"><label for="f_'+k+'">'+esc(l)+(req?' <span class="req">*</span>':'')+'</label>'+input+'</div>';
  }).join('')+'</div></fieldset>').join('');
  const ov=openModal(
    '<div class="modal-head"><div class="ttl"><div class="kicker">'+(isNew?'Registro nuevo':'Editando título No. '+esc(r.noTitulo||'s/n'))+'</div><h2>'+(isNew?'Nuevo título':esc(r.titular||''))+'</h2></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<form class="modal-body" novalidate>'+fs+'<p class="hint">Las fechas se escriben como dd/mm/aaaa. Si deja vacíos el año y el mes, se toman de la fecha de emisión. El No. de título es también el No. de espacio. Los pagos de prórroga se registran con el botón “Cobrar prórroga” de la ficha.</p></form>'+
    '<div class="modal-foot"><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" data-save type="button">'+(isNew?'Guardar título':'Guardar cambios')+'</button></div>');
  const form=ov.querySelector('form');
  form.addEventListener('submit',e=>e.preventDefault());
  form.querySelectorAll('[data-tarifa]').forEach(b=>b.onclick=()=>{const i=form.elements[b.dataset.tarifa];i.value=b.dataset.v;i.dispatchEvent(new Event('input'));i.focus();});
  // al escribir el recibo de un servicio con el monto vacío, se llena con la tarifa
  SECTIONS.forEach(s=>{ const m=s.f.find(f=>f[2]==='money'); const rc=s.f.find(f=>/^recibo/.test(f[0])); if(!m||!rc) return;
    const ri=form.elements[rc[0]], mi=form.elements[m[0]];
    ri.addEventListener('change',()=>{ if(ri.value.trim()&&!mi.value.trim()){ mi.value=fmtMonto(tarifa(m[3])); mi.classList.add('autofill'); setTimeout(()=>mi.classList.remove('autofill'),1500);} }); });
  ov.querySelector('[data-save]').onclick=async()=>{
    form.querySelectorAll('.field.err').forEach(f=>{f.classList.remove('err');const m=f.querySelector('.msg');m&&m.remove();});
    const data={};
    ALL_FIELDS.forEach(([k,,type])=>{if(type==='check'){data[k]=form.elements[k].checked?'si':'';return;}let v=(form.elements[k].value||'').replace(/[ \t]+/g,' ').trim();if(DATE_FIELDS.has(k)) v=toISO(v);data[k]=v;});
    ['titular','ampo','mes'].forEach(k=>data[k]=data[k].toUpperCase());
    if(isISO(data.fechaEmision)){ if(!data.anio) data.anio=data.fechaEmision.slice(0,4); if(!data.mes) data.mes=MESES[+data.fechaEmision.slice(5,7)-1]; }
    if(!data.titular){const f=form.elements.titular.closest('.field');f.classList.add('err');f.insertAdjacentHTML('beforeend','<div class="msg">Escriba el nombre del titular.</div>');form.elements.titular.focus();return;}
    if(data.inicioPeriodos&&!isISO(data.inicioPeriodos)){const f=form.elements.inicioPeriodos.closest('.field');f.classList.add('err');f.insertAdjacentHTML('beforeend','<div class="msg">Use el formato dd/mm/aaaa.</div>');form.elements.inicioPeriodos.focus();return;}
    if(data.fechaEmision&&!isISO(data.fechaEmision)){const f=form.elements.fechaEmision.closest('.field');f.classList.add('err');f.insertAdjacentHTML('beforeend','<div class="msg">Use el formato dd/mm/aaaa.</div>');form.elements.fechaEmision.focus();return;}
    for(const [k] of MONEY_FIELDS){ if(!data[k]) continue; const n=data[k].replace(/[$\s]/g,'').replace(',','.'); if(!/^\d+(\.\d{1,2})?$/.test(n)){const f=form.elements[k].closest('.field');f.classList.add('err');f.insertAdjacentHTML('beforeend','<div class="msg">Escriba solo el número, por ejemplo 21.00</div>');form.elements[k].focus();return;} data[k]=fmtMonto(+n); }
    for(const k of ['fechaEnterramiento2','fechaPagoEnterramiento2','fechaReparacion','fechaPagoConstruccion','fechaPagoBovedaSobre','fechaPagoServicios']){ if(data[k]&&!isISO(data[k])){const f=form.elements[k].closest('.field');f.classList.add('err');f.insertAdjacentHTML('beforeend','<div class="msg">Use el formato dd/mm/aaaa.</div>');form.elements[k].focus();return;} }
    if((data.montoEnterramiento2||data.reciboEnterramiento2||data.fechaPagoEnterramiento2||data.fechaEnterramiento2)&&!data.personaEnterradaSobre){const f=form.elements.personaEnterradaSobre.closest('.field');f.classList.add('err');f.insertAdjacentHTML('beforeend','<div class="msg">Escriba el nombre de la persona enterrada sobre bóveda.</div>');form.elements.personaEnterradaSobre.focus();return;}
    if(data.personaEnterradaSobre&&!data.fechaEnterramiento2&&!data.fechaPagoEnterramiento2&&data.personaEnterradaSobre!==(r.personaEnterradaSobre||'')){
      if(!await confirmBox('Falta la fecha','<p style="margin:0">Registró una persona enterrada sobre bóveda sin fecha de enterramiento ni fecha de pago. Sin fecha no se cuenta en el reporte de inhumaciones del mes. ¿Guardar así?</p>','Guardar sin fecha')){form.elements.fechaEnterramiento2.focus();return;}
    }
    const t=(data.noTitulo||'').replace(/^0+/,'');
    const dup=t&&records.find(x=>x._t===t&&x.id!==r.id);
    if(dup){const ok=await confirmBox('Número de título repetido','<p style="margin:0">El título No. <b>'+esc(data.noTitulo)+'</b> ya está registrado a nombre de <b>'+esc(dup.titular)+'</b>. ¿Desea guardarlo de todos modos?</p>','Guardar de todos modos');if(!ok) return;}
    const btn=ov.querySelector('[data-save]'); btn.disabled=true; btn.textContent='Guardando…';
    try{
      const base=Object.assign({},r); delete base.id; delete base._c; delete base._s; delete base._t; delete base._p;
      const rec=Object.assign(base,data,{modificado:new Date().toISOString()});
      let id=r.id, chunk=r._c;
      if(isNew){
        id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        chunk='y'+(/^\d{4}$/.test(rec.anio)?rec.anio:'sin');
        rec.creado=new Date().toISOString(); rec.filaExcel='';
        rec.pagosProrroga=[]; rec.prMig=1;
      }
      await writeRec(chunk,id,rec,isNew);
      closeTop(); toast(isNew?'Título guardado':'Cambios guardados');
      if(isNew){ setTimeout(()=>byId.get(id)&&showDetail(id),350); }
      else setTimeout(()=>showDetail(id),200);
    }catch(err){
      btn.disabled=false; btn.textContent=isNew?'Guardar título':'Guardar cambios';
      alertErr(err);
    }
  };
}
async function writeRec(chunk,id,rec,isNew){ return webWriteRec(id,rec,isNew); }
async function deleteRec(r){
  const ok=await confirmBox('Eliminar título','<p style="margin:0">Se eliminará el título No. <b>'+esc(r.noTitulo||'s/n')+'</b> de <b>'+esc(r.titular)+'</b>. Esta acción no se puede deshacer.</p>','Eliminar título',true);
  if(!ok) return;
  try{ await webDelete(r.id); closeTop(); toast('Título eliminado'); }
  catch(err){ alertErr(err); }
}
function alertErr(err){
  const code=err&&err.code;
  if(code==='conflicto') return confirmBox('Otro usuario modificó este título','<p style="margin:0">Mientras usted editaba, otra persona guardó cambios en este mismo título. Se cargó la versión más reciente; abra el título y vuelva a hacer su cambio.</p>','Entendido');
  if(err&&err.mensaje) return confirmBox('No se guardó','<p style="margin:0">'+esc(err.mensaje)+'</p>','Entendido');
  const msg=code==='storage'?'El navegador no permitió guardar los datos (almacenamiento lleno o bloqueado). Descargue un respaldo para no perder cambios.':code==='quota_exceeded'?'La base de datos llegó a su límite de espacio. Consulte con el administrador.':
    (code==='invalid_argument'?'No tiene permiso para modificar los datos, o el registro es demasiado grande.':'No se pudo guardar por un problema de conexión. Intente de nuevo en unos segundos.');
  confirmBox('No se guardó','<p style="margin:0">'+esc(msg)+'</p>','Entendido');
}

/* ---------- Exportar ---------- */
async function exportCSV(){
  const cols=[['noTitulo','No. título / espacio']].concat(ALL_FIELDS.filter(f=>f[0]!=='noTitulo').map(f=>[f[0],f[1]]));
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const extra=[['Inicio de períodos',r=>r._p&&r._p.ini?fmtDate(r._p.ini.f):''],['Períodos pagados',r=>r._p&&r._p.pagados!=null?r._p.pagados:''],['Cubierto hasta',r=>r._p&&r._p.hasta?fmtDate(r._p.hasta):''],
    ['Situación prórroga',r=>r._p?({aldia:'Al día',porvencer:'Por vencer',pendiente:'Pendiente',vencido:'Vencido',sininicio:'Revisar inicio',noaplica:'No se cobra',sinent:'Sin enterramiento'})[r._p.k]:''],['Períodos adeudados',r=>r._p&&r._p.adeudados||''],['Saldo pendiente',r=>r._p&&r._p.saldo?(Math.round(r._p.saldo*100)/100).toFixed(2):''],
    ['Recibos de prórroga',r=>(r.pagosProrroga||[]).map(x=>x.recibo).filter(Boolean).join(' / ')]];
  const lines=[cols.map(c=>q(c[1])).concat(extra.map(e=>q(e[0]))).join(',')].concat(filtered.map(r=>cols.map(([k,,type])=>q(type==='check'?(r[k]?'Sí':''):DATE_FIELDS.has(k)?fmtDate(r[k]):r[k])).concat(extra.map(e=>q(e[1](r)))).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  saveBlob(blob,'titulos_cementerio_'+new Date().toISOString().slice(0,10)+'.csv');
}

function repMerge(x){
  const d=repDefaults(); if(!x||typeof x!=='object') return d;
  const cfg=Object.assign({},d.cfg,x.cfg||{});
  const seen=new Set(); const filas=[];
  (Array.isArray(cfg.filas)?cfg.filas:[]).forEach(f=>{if(f&&DEF[f.id]&&!seen.has(f.id)){seen.add(f.id);filas.push({id:f.id,label:String(f.label||DEF[f.id].label),incluir:f.incluir!==false});}});
  SERV_DEF.forEach(s=>{if(!seen.has(s.id)) filas.push({id:s.id,label:s.label,incluir:!s.off});});
  cfg.filas=filas;
  return {cfg,manual:(x.manual&&typeof x.manual==='object')?x.manual:{},ajustes:(x.ajustes&&typeof x.ajustes==='object')?x.ajustes:{},prorroga:(x.prorroga&&typeof x.prorroga==='object')?x.prorroga:{},tarifas:(x.tarifas&&typeof x.tarifas==='object')?x.tarifas:{}};
}

/* --- fechas contenidas en un campo --- */
function datesIn(v){
  v=String(v||'').trim(); if(!v) return [];
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return [v];
  const out=[]; const re=/(\d{1,2})[\/.\-](\d{1,2})[\/.\-]0?(\d{4})/g; let m;
  while((m=re.exec(v))){const d=+m[1],mo=+m[2],y=+m[3]; if(d>=1&&d<=31&&mo>=1&&mo<=12&&y>1900) out.push(y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'));}
  const re2=/(\d{4})-(\d{2})-(\d{2})/g; while((m=re2.exec(v))) out.push(m[0]);
  return out;
}
function emisionYM(r){
  const d=datesIn(r.fechaEmision); if(d.length) return {ym:d[0].slice(0,7),f:d[0]};
  const mi=MES_NOM.indexOf(String(r.mes||'').trim().toUpperCase());
  if(/^\d{4}$/.test(r.anio||'')&&mi>=0) return {ym:r.anio+'-'+String(mi+1).padStart(2,'0'),f:''};
  return null;
}

let IDX=null;

function idx(){
  if(IDX) return IDX;
  const I={}; SERV_DEF.forEach(s=>I[s.id]={});
  const add=(sid,iso,r,why)=>{const ym=iso.slice(0,7);(I[sid][ym]=I[sid][ym]||[]).push({r,why,f:iso});};
  records.forEach(r=>{
    const em=emisionYM(r);
    if(em) add('titulos',em.f||em.ym+'-00',r,em.f?'Emitido '+fmtDate(em.f):'Emitido en '+MES_TIT[+em.ym.slice(5)-1].toLowerCase()+' '+em.ym.slice(0,4));
    const ent=datesIn(r.fechaEnterramiento);
    ent.forEach((f,i)=>add('inhumaciones',f,r,'Enterramiento '+fmtDate(f)+(ent.length>1?' ('+(i+1)+' de '+ent.length+')':'')));
    if(!ent.length&&r.sepultados&&r.montoEnterramiento&&em) add('inhumaciones',em.f||em.ym+'-00',r,'Pago de enterramiento con el título'+(em.f?' ('+fmtDate(em.f)+')':''));
    { const e2=datesIn(r.fechaEnterramiento2); (e2.length?e2:datesIn(r.fechaPagoEnterramiento2)).forEach(f=>add('inhumaciones',f,r,'Enterramiento sobre bóveda '+fmtDate(f)+(r.personaEnterradaSobre&&r.personaEnterradaSobre.length<=60?' · '+r.personaEnterradaSobre:''))); }
    (Array.isArray(r.pagosProrroga)?r.pagosProrroga:[]).forEach(p=>{ if(isISO(p.fecha)) add('prorrogas',p.fecha,r,'Canceló '+(+p.periodos||0)+' período(s)'+(p.recibo?' · recibo '+p.recibo:'')); });
    if(r.construyoBoveda&&!/^\s*no\b/i.test(r.construyoBoveda)&&em) add('construccion',em.f||em.ym+'-00',r,'Título con construcción de bóveda'+(em.f?' ('+fmtDate(em.f)+')':''));
    datesIn(r.fechaPagoBovedaSobre).forEach(f=>add('construccion',f,r,'Bóveda sobre otra '+fmtDate(f)));
    datesIn(r.fechaPagoUnaSobreOtra).forEach(f=>add('construccion',f,r,'Construcción una sobre otra '+fmtDate(f)));
    datesIn(r.fechaReparacion).forEach(f=>add('reparaciones',f,r,'Reparación '+fmtDate(f)));
  });
  for(const s in I) for(const ym in I[s]) I[s][ym].sort((a,b)=>a.f.localeCompare(b.f));
  return IDX=I;
}

const PRESETS=[['1er trimestre',0,2],['2do trimestre',3,5],['3er trimestre',6,8],['4to trimestre',9,11],['1er semestre',0,5],['2do semestre',6,11],['Año completo',0,11]];
function repYears(){
  let mn=nowY; records.forEach(r=>{const e=emisionYM(r); if(e){const y=+e.ym.slice(0,4); if(y<mn&&y>1900) mn=y;}});
  const ys=[]; for(let y=Math.max(nowY+1,RS.anioHasta,RS.anio);y>=mn;y--) ys.push(y); return ys;
}
function repColumns(){
  if(RS.mode==='mensual'){
    const cs=[]; for(let m=RS.desde;m<=RS.hasta;m++){const ym=RS.anio+'-'+String(m+1).padStart(2,'0');cs.push({key:ym,label:MES_NOM[m],months:[ym],single:true});} return cs;
  }
  const cs=[]; for(let y=RS.anioDesde;y<=RS.anioHasta;y++){cs.push({key:String(y),label:String(y),months:MES_NOM.map((_,i)=>y+'-'+String(i+1).padStart(2,'0')),single:false});} return cs;
}
function periodoTxt(){
  if(RS.mode==='mensual'){
    const ms=MES_NOM.slice(RS.desde,RS.hasta+1);
    if(ms.length===1) return 'PERIODO DE '+ms[0]+' '+RS.anio;
    if(ms.length<=3) return 'PERIODO DE '+ms.slice(0,-1).join(', ')+' Y '+ms[ms.length-1]+' '+RS.anio;
    return 'PERIODO DE '+ms[0]+' A '+ms[ms.length-1]+' '+RS.anio;
  }
  return RS.anioDesde===RS.anioHasta?'PERIODO DEL AÑO '+RS.anioDesde:'PERIODO DE LOS AÑOS '+RS.anioDesde+' A '+RS.anioHasta;
}
const filasActivas=()=>REP.cfg.filas.filter(f=>f.incluir);
const numTxt=n=>n?String(n):(REP.cfg.ceros?'0':'');

/* --- documento (pantalla / impresión) --- */
function buildDoc(interactive){
  const c=REP.cfg, cols=repColumns(), filas=filasActivas();
  const head='<div class="doc-head">'+(c.logos?'<img src="'+LOGO_IZQ+'" alt="">':'<span></span>')+
    '<div class="lines"><div>'+esc(c.alcaldia)+'</div><div>'+esc(c.unidad)+'</div><div>'+esc(periodoTxt())+'</div><div>'+esc(c.titulo)+'</div></div>'+
    (c.logos?'<img src="'+LOGO_DER+'" alt="">':'<span></span>')+'</div>';
  const nNum=cols.length+(c.total?1:0), wNum=Math.min(12,58/Math.max(nNum,1));
  let t='<table><colgroup><col style="width:16%"><col>'+('<col style="width:'+wNum.toFixed(2)+'%">').repeat(nNum)+'</colgroup><thead><tr><th>Distrito</th><th>Nombre del servicio</th>'+cols.map(x=>'<th>'+esc(x.label)+'</th>').join('')+(c.total?'<th>Total</th>':'')+'</tr></thead><tbody>';
  if(!filas.length) t+='<tr><td colspan="'+(cols.length+3)+'" style="text-align:center;padding:24px">No hay servicios seleccionados. Use “Encabezado y servicios” para elegirlos.</td></tr>';
  filas.forEach((f,i)=>{
    const d=DEF[f.id]; let tot=0;
    t+='<tr>'+(i===0?'<td class="dist" rowspan="'+filas.length+'">'+esc(c.distrito)+'</td>':'')+'<td>'+esc(f.label)+'</td>';
    cols.forEach(col=>{
      const v=colVal(f.id,col); tot+=v;
      if(!interactive){ t+='<td class="n">'+numTxt(v)+'</td>'; return; }
      if(d.tipo==='manual'&&!(col.single&&(f.id+'|'+col.key) in REP.ajustes)){
        if(col.single) t+='<td class="n cell-man"><input inputmode="numeric" data-man="'+f.id+'" data-ym="'+col.key+'" value="'+(v||'')+'"'+(canWrite?'':' readonly')+' aria-label="'+esc(f.label+', '+col.label)+'"></td>';
        else t+='<td class="n cell-man ro" title="Suma de lo ingresado mes por mes">'+numTxt(v)+'</td>';
      } else {
        t+='<td class="n cell-auto'+(colAdj(f.id,col)?' cell-adj':'')+'" tabindex="0" data-cell="'+f.id+'" data-col="'+col.key+'" title="Ver de dónde sale este número">'+numTxt(v)+'</td>';
      }
    });
    if(c.total) t+='<td class="n tot" data-tot="'+f.id+'">'+numTxt(tot)+'</td>';
    t+='</tr>';
  });
  t+='</tbody></table>';
  return '<div class="doc">'+head+t+'</div>';
}
function repRender(){
  // controles
  const ys=repYears();
  const opt=(arr,sel)=>arr.map(([v,l])=>'<option value="'+v+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>').join('');
  $('#rAnio').innerHTML=opt(ys.map(y=>[y,y]),RS.anio);
  $('#rDesde').innerHTML=opt(MES_TIT.map((m,i)=>[i,m]),RS.desde);
  $('#rHasta').innerHTML=opt(MES_TIT.map((m,i)=>[i,m]),RS.hasta);
  $('#rAnioDesde').innerHTML=opt(ys.map(y=>[y,y]),RS.anioDesde);
  $('#rAnioHasta').innerHTML=opt(ys.map(y=>[y,y]),RS.anioHasta);
  $('#rPresets').innerHTML=PRESETS.map(([l,a,b],i)=>'<button type="button" data-p="'+i+'" aria-pressed="'+(RS.desde===a&&RS.hasta===b)+'">'+l+'</button>').join('');
  $('#rPresets').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.p];RS.desde=p[1];RS.hasta=p[2];repRender();});
  document.querySelectorAll('.seg-b').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===RS.mode)));
  $('#ctlMensual').hidden=RS.mode!=='mensual'; $('#ctlAnual').hidden=RS.mode!=='anual';
  $('#rHint').textContent=RS.mode==='mensual'
    ?'Haga clic en un número para ver qué títulos lo forman o ajustarlo. Las celdas amarillas no tienen datos en el sistema: escríbalas a mano y se guardan por mes.'
    :'Cada año suma sus doce meses, incluidas las cifras escritas a mano y los ajustes hechos en el reporte mes por mes.';
  $('#rPaper').innerHTML=buildDoc(true);
  $('#rLegend').innerHTML='<span><i class="sw auto"></i>Calculado de los títulos</span><span><i class="sw man"></i>Escrito a mano</span><span><i class="sw adj"></i>Ajustado a mano</span>';
  // eventos
  $('#rPaper').querySelectorAll('[data-cell]').forEach(td=>{
    const open=()=>cellDetail(td.dataset.cell,td.dataset.col);
    td.onclick=open; td.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();open();}};
  });
  const ins=[...$('#rPaper').querySelectorAll('[data-man]')];
  ins.forEach(inp=>{
    inp.addEventListener('input',()=>{
      inp.value=inp.value.replace(/[^\d]/g,'');
      const id=inp.dataset.man, ym=inp.dataset.ym, n=parseInt(inp.value,10);
      const m=REP.manual[ym]=REP.manual[ym]||{};
      if(n>0) m[id]=n; else delete m[id];
      if(!Object.keys(m).length) delete REP.manual[ym];
      saveRep();
      const tc=$('#rPaper').querySelector('[data-tot="'+id+'"]');
      if(tc) tc.textContent=numTxt(repColumns().reduce((s,col)=>s+colVal(id,col),0));
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){
        const same=ins.filter(x=>x.dataset.ym===inp.dataset.ym); const i=same.indexOf(inp);
        const nx=same[i+(e.key==='ArrowUp'?-1:1)]; if(nx){e.preventDefault();nx.focus();nx.select();}
      }
    });
    inp.addEventListener('focus',()=>inp.select());
  });
}

/* --- ventana de detalle de una celda --- */
function cellDetail(id,colKey){
  const col=repColumns().find(c=>c.key===colKey); if(!col) return;
  const d=DEF[id], fila=REP.cfg.filas.find(f=>f.id===id), sid=srcId(id);
  const evs=d.tipo==='manual'?[]:col.months.flatMap(ym=>idx()[sid][ym]||[]);
  const computed=col.months.reduce((s,ym)=>s+calc(id,ym),0), final=colVal(id,col);
  const periodo=col.single?MES_TIT[+col.key.slice(5)-1]+' '+col.key.slice(0,4):'Año '+col.key;
  let regla=d.tipo==='igual'?'Toma el mismo valor que “'+(REP.cfg.filas.find(f=>f.id===d.base)||{}).label+'”, porque cada una de esas atenciones genera este servicio.':(d.regla||'Se escribe a mano en el reporte mes por mes.');
  const list=evs.length?'<ul class="rec-list">'+evs.map((e,i)=>'<li data-rid="'+esc(e.r.id)+'"><span><strong style="font-weight:600">'+esc(e.r.titular||'(sin titular)')+'</strong><br><span class="cellmeta">Título No. '+esc(e.r.noTitulo||'s/n')+(e.r.sepultados&&(sid==='inhumaciones')?' · '+esc(e.r.sepultados.slice(0,70)):'')+'</span></span><span class="why">'+esc(e.why)+'</span></li>').join('')+'</ul>'
    :(d.tipo==='manual'?'':'<p class="cellmeta" style="margin:0">No hay títulos con este servicio en el período.</p>');
  const k=id+'|'+colKey, hasAdj=col.single&&(k in REP.ajustes);
  const adj=!canWrite?'':col.single?'<div class="adj-box"><div class="field"><label for="adjVal">Valor que aparecerá en el reporte</label><input id="adjVal" inputmode="numeric" value="'+(hasAdj?REP.ajustes[k]:'')+'" placeholder="Calculado: '+computed+'"></div>'+
      (hasAdj?'<button class="btn" type="button" data-unadj>Volver al calculado ('+computed+')</button>':'')+'<button class="btn primary" type="button" data-adj>Guardar ajuste</button></div>'+
      '<p class="hint">Use el ajuste solo cuando el número real del mes difiera de lo registrado en los títulos.</p>'
    :(col.months.some(ym=>(id+'|'+ym) in REP.ajustes)?'<p class="hint">Este año incluye meses ajustados a mano; los ajustes se cambian en el reporte mes por mes.</p>':'');
  const ov=openModal(
    '<div class="modal-head"><div class="ttl"><div class="kicker">'+esc(periodo)+'</div><h2>'+esc(fila?fila.label:d.label)+'</h2><div class="kicker" style="margin:6px 0 0">En el reporte: <b style="color:var(--ink)">'+final+'</b>'+(final!==computed?' · calculado de los títulos: '+computed:'')+'</div></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<div class="modal-body"><p class="cellmeta" style="margin:0 0 12px">'+esc(regla)+'</p>'+list+adj+'</div>'+
    '<div class="modal-foot"><button class="btn" data-close type="button">Cerrar</button></div>');
  ov.querySelectorAll('[data-rid]').forEach(li=>li.onclick=()=>showDetail(li.dataset.rid));
  const a=ov.querySelector('[data-adj]');
  if(a) a.onclick=()=>{
    const raw=ov.querySelector('#adjVal').value.trim();
    if(raw===''){ delete REP.ajustes[k]; }
    else { const n=parseInt(raw,10); if(!(n>=0)){ toast('Escriba un número entero'); return; } REP.ajustes[k]=n; }
    saveRep(); closeTop(); repRender(); toast('Ajuste guardado');
  };
  const u=ov.querySelector('[data-unadj]');
  if(u) u.onclick=()=>{ delete REP.ajustes[k]; saveRep(); closeTop(); repRender(); toast('Se usa el valor calculado'); };
}

    filas.forEach(x=>{x.label=x.label.trim()||DEF[x.id].label;});
    c.filas=filas; saveRep(); closeTop(); repRender(); toast('Reporte actualizado');
  };
}

/* --- Excel (.xlsx) generado en el navegador --- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const dt=new Date(), dosT=(dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1), dosD=((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
  files.forEach(f=>{
    const name=enc.encode(f.name), data=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dosT,true);h.setUint16(12,dosD,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dosT,true);c.setUint16(14,dosD,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  });
  const cs=central.reduce((s,a)=>s+a.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const b64u8=s=>{const b=atob(s.split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colL(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function repXlsx(){
  const c=REP.cfg, cols=repColumns(), filas=filasActivas();
  const ncol=2+cols.length+(c.total?1:0), last=ncol-1;
  // registro de estilos
  const fonts=[],borders=[],xfs=[]; const reg=(arr,k)=>{let i=arr.indexOf(k);if(i<0){arr.push(k);i=arr.length-1;}return i;};
  const style=({b=false,red=false,l='',r='',t='',bo='',h='',v='center',wrap=false})=>{
    const fi=reg(fonts,(b?1:0)+'|'+(red?1:0)), bi=reg(borders,[l,r,t,bo].join('|'));
    return reg(xfs,[fi,bi,h,v,wrap?1:0].join('|'));
  };
  style({v:''}); // xf 0 por defecto
  const rows=[]; const merges=[];
  const put=(r,ci,val,s)=>{(rows[r]=rows[r]||[])[ci]={val,s};};
  const H=6; // filas de encabezado
  const lines=[null,c.alcaldia,c.unidad,periodoTxt(),c.titulo,null];
  for(let r=1;r<=H;r++){
    for(let ci=0;ci<ncol;ci++){
      put(r,ci,ci===0&&lines[r-1]!=null?lines[r-1]:'',style({b:true,h:'center',l:ci===0?'medium':'',r:ci===last?'medium':'',t:r===1?'medium':''}));
    }
    if(lines[r-1]!=null) merges.push('A'+r+':'+colL(last)+r);
  }
  const hr=H+1, heads=['DISTRITO','NOMBRE DEL SERVICIO'].concat(cols.map(x=>x.label)).concat(c.total?['TOTAL']:[]);
  heads.forEach((x,ci)=>put(hr,ci,x,style({b:true,h:'center',l:'medium',r:'medium',t:'medium',bo:'medium',wrap:true})));
  const r0=hr+1, n=Math.max(filas.length,1);
  filas.forEach((f,i)=>{
    const r=r0+i, lastRow=i===filas.length-1;
    put(r,0,i===0?c.distrito:'',style({red:true,h:'center',l:'medium',r:'medium',bo:lastRow?'medium':''}));
    put(r,1,f.label,style({l:'thin',r:'thin',t:'thin',bo:lastRow?'medium':'thin',wrap:true}));
    let tot=0;
    cols.forEach((col,j)=>{const v=colVal(f.id,col);tot+=v;put(r,2+j,v||(c.ceros?0:''),style({h:'center',l:'thin',r:(2+j===last)?'medium':'thin',t:'thin',bo:lastRow?'medium':'thin'}));});
    if(c.total) put(r,last,tot||(c.ceros?0:''),style({b:true,h:'center',l:'thin',r:'medium',t:'thin',bo:lastRow?'medium':'thin'}));
  });
  if(filas.length>1) merges.push('A'+r0+':A'+(r0+filas.length-1));
  const lastR=r0+n-1;
  // hoja
  const widths=[21.1,53].concat(cols.map(()=>14.7)).concat(c.total?[12]:[]);
  let sd='';
  for(let r=1;r<=lastR;r++){
    const row=rows[r]||[]; const ht=r<=H?' ht="16.5" customHeight="1"':(r===hr?' ht="22" customHeight="1"':' ht="21" customHeight="1"');
    sd+='<row r="'+r+'"'+ht+'>';
    row.forEach((cell,ci)=>{ if(!cell) return; const ref=colL(ci)+r;
      if(cell.val===''||cell.val==null) sd+='<c r="'+ref+'" s="'+cell.s+'"/>';
      else if(typeof cell.val==='number') sd+='<c r="'+ref+'" s="'+cell.s+'"><v>'+cell.val+'</v></c>';
      else sd+='<c r="'+ref+'" s="'+cell.s+'" t="inlineStr"><is><t xml:space="preserve">'+xe(cell.val)+'</t></is></c>';
    });
    sd+='</row>';
  }

/* ====================================================================
   PRÓRROGAS · períodos desde la fecha de enterramiento
   ==================================================================== */
const pad2=n=>String(n).padStart(2,'0');
const isoHoy=()=>{const t=new Date();return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());};
function addYearsISO(iso,n){
  const y=+iso.slice(0,4)+n, m=+iso.slice(5,7), d=+iso.slice(8,10);
  const last=new Date(y,m,0).getDate();
  return y+'-'+pad2(m)+'-'+pad2(Math.min(d,last));
}
const diasEntre=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const money=n=>'$'+(Math.round((+n||0)*100)/100).toFixed(2);
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaLarga=iso=>isISO(iso)?(+iso.slice(8,10))+' de '+MESES_L[+iso.slice(5,7)-1]+' de '+iso.slice(0,4):'';

function prCfg(){
  const p=(REP&&REP.prorroga)||{};
  const precio=parseFloat(p.precio);
  return {anos:(+p.anos>=1&&+p.anos<=99)?+p.anos:7, precio:(precio>=0)?precio:7.35, regla:p.regla==='cobertura'?'cobertura':'periodo', aviso:(+p.aviso>=0&&p.aviso!==''&&p.aviso!=null)?+p.aviso:60};
}
function prInicio(r){
  if(isISO(r.inicioPeriodos)) return {f:r.inicioPeriodos,origen:'manual'};
  const d=datesIn(r.fechaEnterramiento)[0];
  return d?{f:d,origen:'enterramiento'}:null;
}
function prPagos(r){
  const a=Array.isArray(r.pagosProrroga)?r.pagosProrroga.slice():[];
  // las importadas del Excel van primero; luego por fecha de pago
  return a.sort((x,y)=>((x.origen==='excel'?0:1)-(y.origen==='excel'?0:1))||String(x.fecha||'').localeCompare(String(y.fecha||'')));
}
/* historial con el tramo que cubre cada pago */
function prHistorial(r){
  const c=prCfg(), ini=prInicio(r); let acum=0;
  return prPagos(r).map(p=>{
    const n=+p.periodos||0;
    const desde=ini?addYearsISO(ini.f,acum*c.anos):'', hasta=ini?addYearsISO(ini.f,(acum+n)*c.anos):'';
    acum+=n; return Object.assign({},p,{desde,hasta});
  });
}
function computeProrroga(r){
  const c=prCfg(), hoy=isoHoy();
  if(r.noAplicaProrroga==='si') return {k:'noaplica',label:'No se cobra',saldo:0,adeudados:0};
  const ini=prInicio(r), pagos=prPagos(r);
  const pagados=pagos.reduce((s,p)=>s+(+p.periodos||0),0);
  if(!ini){
    if(pagados||r.sepultados||r.notaProrroga) return {k:'sininicio',label:'Falta fecha de inicio',pagados,saldo:0,adeudados:0};
    return {k:'sinent',label:'Sin enterramiento',saldo:0,adeudados:0};
  }
  const hasta=addYearsISO(ini.f,pagados*c.anos);
  const pend=[];
  if(hoy>hasta){
    let i=pagados;
    while(pend.length<200){
      const d=addYearsISO(ini.f,i*c.anos), e=addYearsISO(ini.f,(i+1)*c.anos);
      if(d>=hoy&&pend.length) break;
      pend.push({n:i+1,desde:d,hasta:e,vencido:e<hoy,valor:c.precio});
      i++; if(e>=hoy) break;
    }
  }
  const adeudados=pend.length, saldo=adeudados*c.precio;
  let k;
  if(!adeudados) k=diasEntre(hoy,hasta)<=c.aviso?'porvencer':'aldia';
  else k=(c.regla==='cobertura'||pend.some(p=>p.vencido))?'vencido':'pendiente';
  const label=k==='aldia'?'Al día hasta '+fmtDate(hasta):k==='porvencer'?'Vence el '+fmtDate(hasta):
    k==='pendiente'?'Pendiente · '+money(saldo):'Vencido · '+adeudados+' per. · '+money(saldo);
  return {k,ini,pagados,hasta,pend,adeudados,saldo,label};
}
const PR_BADGE={aldia:'ok',porvencer:'warn',pendiente:'warn',vencido:'danger'};
function prBadge(p,short){
  if(!p) return '<span class="badge none">—</span>';
  if(p.k==='sinent') return '<span class="badge none">—</span>';
  if(p.k==='sininicio') return '<span class="badge none" title="Tiene personas sepultadas pero falta la fecha de enterramiento o de inicio">Revisar inicio</span>';
  if(p.k==='noaplica') return '<span class="badge none">No se cobra</span>';
  const txt=short?({aldia:'Al día',porvencer:'Por vencer',pendiente:'Pendiente',vencido:'Vencido'})[p.k]:p.label;
  return '<span class="badge '+PR_BADGE[p.k]+'">'+esc(txt)+'</span>';
}

/* --- migración de los datos del Excel (una sola vez por título) --- */
function migrateAll(){
  let n=0;
  for(const id in STORE){
    const r=STORE[id]; if(!r||typeof r!=='object'||r.prMig) continue;
    if(!Array.isArray(r.pagosProrroga)) r.pagosProrroga=[];
    const per=String(r.periodos||'').trim(), num=/^\d{1,2}$/.test(per)?+per:0;
    const ent=datesIn(r.fechaEnterramiento)[0];
    const hx=datesIn(r.prorrogaHasta)[0];
    const notas=r.notaProrroga?[r.notaProrroga]:[];
    if(per&&!num) notas.push('Períodos (Excel): '+per);
    if(r.prorrogaHasta&&!(ent&&num&&hx)) notas.push('Cubre hasta (Excel): '+(isISO(r.prorrogaHasta)?fmtDate(r.prorrogaHasta):r.prorrogaHasta));
    if(num&&!r.pagosProrroga.length){
      const conRecibo=isISO(r.fechaPagoProrroga)&&/^\d[\d\s,\-]*$/.test(String(r.recibo||'').trim());
      r.pagosProrroga.push({id:'excel',fecha:isISO(r.fechaPagoProrroga)?r.fechaPagoProrroga:'',periodos:num,monto:'',recibo:conRecibo?String(r.recibo).trim():'',
        nota:'Importado del Excel: total de períodos cubiertos'+(conRecibo?' (recibo tomado de la columna RECIBO No.)':''),origen:'excel'});
    }
    if(!ent&&num&&hx&&!r.inicioPeriodos){ r.inicioPeriodos=addYearsISO(hx,-num*7); notas.push('Inicio calculado a partir de la fecha "cubre hasta" del Excel.'); }
    if(ent&&num&&hx){ const calc=addYearsISO(ent,num*7); if(calc!==hx) notas.push('Revisar: el Excel dice que cubre hasta '+fmtDate(hx)+'; contando desde el enterramiento da '+fmtDate(calc)+'.'); }
    r.notaProrroga=notas.join('\n');
    r.prMig=1; n++;
  }
  return n;
}

function recCopy(r){ const b=Object.assign({},STORE[r.id]||r); ['id','_c','_s','_t','_p'].forEach(k=>delete b[k]); return b; }

/* --- ventana: cobrar prórroga / calculadora --- */
function cobrarProrroga(r){
  const c=prCfg(), p=r._p||computeProrroga(r);
  const ini=prInicio(r);
  const pagadosAntes=(p.pagados||0);
  const sugerido=Math.max(1,p.adeudados||0);
  const ov=openModal(
    '<div class="modal-head"><div class="ttl"><div class="kicker"><span class="titlenum">Título / espacio No. '+esc(r.noTitulo||'s/n')+'</span></div><h2>Cobrar prórroga</h2><div class="kicker" style="margin:6px 0 0">'+esc(r.titular||'')+'</div></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<form class="modal-body" novalidate>'+
      '<section class="sec" style="margin-bottom:14px"><dl>'+
        '<dt>Inicio de períodos</dt><dd>'+(ini?esc(fmtDate(ini.f))+' <span class="cellmeta">('+(ini.origen==='manual'?'fecha indicada en el título':'fecha de enterramiento')+')</span>':'<span style="color:var(--danger)">Falta la fecha</span>')+'</dd>'+
        '<dt>Períodos ya pagados</dt><dd>'+pagadosAntes+'</dd>'+
        (ini?'<dt>Cubierto hasta</dt><dd>'+esc(fmtDate(p.hasta))+' '+prBadge(p,true)+'</dd>':'')+
        (p.adeudados?'<dt>Adeudado a hoy</dt><dd><b>'+p.adeudados+' período'+(p.adeudados>1?'s':'')+' = '+money(p.saldo)+'</b></dd>':'')+
      '</dl></section>'+
      (ini?'':'<div class="field" style="margin-bottom:14px"><label for="c_ini">Fecha de enterramiento o inicio de períodos <span class="req">*</span></label><input id="c_ini" placeholder="dd/mm/aaaa" autocomplete="off"></div>')+
      '<div class="calc">'+
        '<div class="field"><label for="c_n">Períodos a pagar ('+c.anos+' años c/u)</label>'+
          '<div class="stepper"><button type="button" class="btn" data-dn aria-label="Uno menos">−</button><input id="c_n" inputmode="numeric" value="'+sugerido+'"><button type="button" class="btn" data-up aria-label="Uno más">+</button></div>'+
          '<div class="quick">'+[1,2,3,4].map(n=>'<button type="button" data-q="'+n+'">'+n+'</button>').join('')+(p.adeudados>1&&p.adeudados>4?'<button type="button" data-q="'+p.adeudados+'">Lo adeudado ('+p.adeudados+')</button>':'')+'</div>'+
        '</div>'+
        '<div class="calc-out" aria-live="polite"><div class="cellmeta" id="c_formula"></div><div class="calc-total" id="c_total"></div><div id="c_cubre"></div></div>'+
      '</div>'+
      '<div class="grid" style="margin-top:14px">'+
        '<div class="field"><label for="c_fecha">Fecha de pago</label><input id="c_fecha" value="'+esc(fmtDate(isoHoy()))+'" placeholder="dd/mm/aaaa" autocomplete="off"></div>'+
        '<div class="field"><label for="c_rec">Recibo No. <span class="req">*</span></label><input id="c_rec" autocomplete="off"></div>'+
        '<div class="field"><label for="c_nota">Nota</label><input id="c_nota" autocomplete="off" placeholder="Opcional"></div>'+
      '</div>'+
    '</form>'+
    '<div class="modal-foot"><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" data-save type="button">Registrar pago</button></div>');
  const $n=ov.querySelector('#c_n');
  const getIni=()=>ini?ini.f:toISO((ov.querySelector('#c_ini')||{}).value||'');
  const upd=()=>{
    let n=parseInt($n.value,10); if(!(n>0)) n=0;
    const f=getIni();
    ov.querySelector('#c_formula').textContent=n?money(c.precio)+' × '+n+' período'+(n>1?'s':''):'Escriba cuántos períodos va a pagar';
    ov.querySelector('#c_total').textContent=money(n*c.precio);
    ov.querySelector('#c_cubre').innerHTML=isISO(f)&&n?'Cubrirá del <b>'+esc(fmtDate(addYearsISO(f,pagadosAntes*c.anos)))+'</b> al <b>'+esc(fmtDate(addYearsISO(f,(pagadosAntes+n)*c.anos)))+'</b>'
      :(isISO(f)?'':'<span class="cellmeta">Escriba la fecha de inicio para calcular hasta cuándo cubre.</span>');
  };
  $n.addEventListener('input',()=>{$n.value=$n.value.replace(/[^\d]/g,'');upd();});
  ov.querySelector('[data-up]').onclick=()=>{$n.value=(parseInt($n.value,10)||0)+1;upd();};
  ov.querySelector('[data-dn]').onclick=()=>{$n.value=Math.max(1,(parseInt($n.value,10)||1)-1);upd();};
  ov.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$n.value=b.dataset.q;upd();});
  const ci=ov.querySelector('#c_ini'); if(ci) ci.addEventListener('input',upd);
  upd();
  const err=(id,msg)=>{const el=ov.querySelector(id), f=el.closest('.field'); f.classList.add('err'); f.insertAdjacentHTML('beforeend','<div class="msg">'+esc(msg)+'</div>'); el.focus();};
  ov.querySelector('[data-save]').onclick=async()=>{
    ov.querySelectorAll('.field.err').forEach(f=>{f.classList.remove('err');const m=f.querySelector('.msg');m&&m.remove();});
    const n=parseInt($n.value,10), f=getIni(), fecha=toISO(ov.querySelector('#c_fecha').value), rec=ov.querySelector('#c_rec').value.trim(), nota=ov.querySelector('#c_nota').value.trim();
    if(!ini&&!isISO(f)) return err('#c_ini','Escriba la fecha como dd/mm/aaaa.');
    if(!(n>0)) return err('#c_n','Escriba al menos 1 período.');
    if(!isISO(fecha)) return err('#c_fecha','Escriba la fecha como dd/mm/aaaa.');
    if(!rec) return err('#c_rec','Escriba el número de recibo.');
    const b=recCopy(r);
    if(!ini) b.inicioPeriodos=f;
    b.pagosProrroga=(Array.isArray(b.pagosProrroga)?b.pagosProrroga.slice():[]);
    b.pagosProrroga.push({id:'p'+Date.now().toString(36),fecha,periodos:n,precio:c.precio,monto:Math.round(n*c.precio*100)/100,recibo:rec,nota,origen:'sistema',registrado:new Date().toISOString()});
    const total=pagadosAntes+n, hasta=addYearsISO(f,total*c.anos);
    Object.assign(b,{periodos:String(total),prorrogaHasta:hasta,fechaPagoProrroga:fecha,reciboProrroga:rec,modificado:new Date().toISOString()});
    try{ await writeRec(r._c,r.id,b,false); closeTop(); toast('Pago registrado: cubre hasta '+fmtDate(hasta)); setTimeout(()=>showDetail(r.id),150); }
    catch(e){ alertErr(e); }
  };
}
async function borrarPagoProrroga(r,pid){

function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
let STORE={}, VERS={}, SEQ=0, YO=null, pollTimer=null, repTimer=null, repSaving=false, repDirty=false;
