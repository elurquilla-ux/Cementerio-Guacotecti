const ROL_TXT={admin:'Administrador',editor:'Editor',lectura:'Solo consulta'};

async function api(method,url,body){
  let res;
  try{
    res=await fetch(url,{method,credentials:'same-origin',headers:Object.assign({'X-Requested-With':'cementerio'},body!==undefined?{'Content-Type':'application/json'}:{}),body:body!==undefined?JSON.stringify(body):undefined});
  }catch(e){ throw {code:'offline',mensaje:'No hay conexión con el servidor. Revise el internet e intente de nuevo.'}; }
  let data=null; try{ data=await res.json(); }catch(e){}
  if(res.status===401&&!/\/api\/(entrar|clave|yo)$/.test(url)){ showLogin('Su sesión terminó. Vuelva a entrar.'); throw {code:'no_autenticado',silencioso:true}; }
  if(res.status===403&&data&&data.error==='cambiar_clave'){ forceChangePassword(); throw {code:'cambiar_clave',silencioso:true}; }
  if(!res.ok) throw Object.assign({code:(data&&data.error)||('http_'+res.status),status:res.status},data||{});
  return data;
}

/* --- guardar / eliminar títulos --- */
async function webWriteRec(id,rec,isNew){
  try{
    const r=await api('PUT','/api/titulos/'+encodeURIComponent(id),{data:rec,base:isNew?null:(VERS[id]==null?null:VERS[id])});
    STORE[id]=r.data; VERS[id]=r.version; ingest();
  }catch(e){
    if(e.code==='conflicto'&&e.data){ STORE[id]=e.data; VERS[id]=e.version; ingest(); }
    throw e;
  }
}
async function webDelete(id){
  await api('DELETE','/api/titulos/'+encodeURIComponent(id));
  delete STORE[id]; delete VERS[id]; ingest();
}
function webSaveRep(){
  repDirty=true; clearTimeout(repTimer);
  repTimer=setTimeout(flushRep,600);
}
async function flushRep(){
  if(repSaving||!repDirty) return;
  repSaving=true; repDirty=false;
  try{ await api('PUT','/api/config/reporte',{data:REP}); }
  catch(e){
    if(!e.silencioso){ toast(e.mensaje||'No se pudo guardar el reporte'); }
    try{ const d=await api('GET','/api/datos'); REP=repMerge(d.reporte||{}); ingest(); if(!$('#viewReportes').hidden) repRender(); }catch(x){}
  }
  finally{ repSaving=false; if(repDirty) flushRep(); }
}

/* --- sincronización con otros usuarios --- */
async function poll(){
  if(!YO||document.hidden) return;
  try{
    const d=await api('GET','/api/cambios?desde='+SEQ);
    let cambio=false;
    for(const id in d.titulos){ if(VERS[id]!==d.versiones[id]){ STORE[id]=d.titulos[id]; VERS[id]=d.versiones[id]; cambio=true; } }
    (d.borrados||[]).forEach(id=>{ if(STORE[id]){ delete STORE[id]; delete VERS[id]; cambio=true; } });
    if(d.reporte&&!repDirty&&!repSaving){ REP=repMerge(d.reporte); cambio=true; if(!$('#viewReportes').hidden&&!document.activeElement.matches('[data-man]')) repRender(); }
    SEQ=Math.max(SEQ,d.seq||0);
    if(cambio) ingest();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });

    '<button class="btn primary" type="submit" style="width:100%;justify-content:center;padding:11px">Entrar</button></form>';
  el.hidden=false; document.body.classList.add('locked');
  const f=el.querySelector('form'), m=el.querySelector('.login-msg');
  setTimeout(()=>el.querySelector('#lg_u').focus(),30);
  api('GET','/api/estado').then(s=>{ if(!s.usuarios&&!s.adminConfigurado) m.textContent='Falta configurar la variable ADMIN_CLAVE en Railway para crear el primer administrador.'; }).catch(e=>{ m.textContent=e.mensaje||'No se pudo conectar con el servidor.'; });
  f.onsubmit=async e=>{
    e.preventDefault();
    const b=f.querySelector('button'); b.disabled=true; m.textContent='';
    try{
      const yo=await api('POST','/api/entrar',{usuario:f.username.value.trim(),clave:f.password.value});
      el.hidden=true; document.body.classList.remove('locked'); await start(yo);
    }catch(err){ m.textContent=err.mensaje||'No se pudo entrar.'; b.disabled=false; f.password.select(); }
  };
}

/* --- claves --- */
function passwordForm(title,intro,forced){
  return new Promise(res=>{
    const ov=openModal('<div class="modal-head"><div class="ttl"><h2>'+esc(title)+'</h2></div>'+(forced?'':'<button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button>')+'</div>'+
      '<form class="modal-body" novalidate>'+(intro?'<p style="margin-top:0">'+intro+'</p>':'')+
        '<div class="field"><label for="pw_a">Clave actual</label><input id="pw_a" type="password" autocomplete="current-password" autofocus></div>'+
        '<div class="field" style="margin-top:10px"><label for="pw_n">Clave nueva (mínimo 8 caracteres)</label><input id="pw_n" type="password" autocomplete="new-password"></div>'+
        '<div class="field" style="margin-top:10px"><label for="pw_r">Repita la clave nueva</label><input id="pw_r" type="password" autocomplete="new-password"></div>'+
        '<p class="login-msg" role="alert"></p></form>'+
      '<div class="modal-foot">'+(forced?'<button class="btn left" data-out type="button">Salir</button>':'<button class="btn" data-close type="button">Cancelar</button>')+'<button class="btn primary" data-save type="button">Cambiar clave</button></div>',{small:true,onClose:()=>res(false)});
    if(forced){ ov.addEventListener('mousedown',e=>{ if(e.target===ov) e.stopImmediatePropagation(); },true); }
    const m=ov.querySelector('.login-msg');
    const go=async()=>{
      const a=ov.querySelector('#pw_a').value,n=ov.querySelector('#pw_n').value,r=ov.querySelector('#pw_r').value;
      if(n.length<8){m.textContent='La clave nueva debe tener al menos 8 caracteres.';return;}
      if(n!==r){m.textContent='Las dos claves nuevas no coinciden.';return;}
      try{ const yo=await api('POST','/api/clave',{actual:a,nueva:n}); YO=Object.assign(YO||{},yo); stack.pop(); ov.remove(); if(!stack.length) document.body.style.overflow=''; toast('Clave cambiada'); res(true); }
      catch(e){ m.textContent=e.mensaje||'No se pudo cambiar la clave.'; }
    };
    ov.querySelector('[data-save]').onclick=go;
    ov.querySelector('form').onsubmit=e=>{e.preventDefault();go();};
    ov.querySelector('#pw_r').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    const out=ov.querySelector('[data-out]'); if(out) out.onclick=logout;
  });
}
let forcing=false;
async function forceChangePassword(){
  if(forcing) return; forcing=true;
  let ok=false;
  while(!ok) ok=await passwordForm('Cambie su clave','Por seguridad, antes de empezar cree una clave personal. No la comparta con nadie.',true);
  forcing=false; await start(YO);
}
async function logout(){ try{ await api('POST','/api/salir'); }catch(e){} location.reload(); }

/* --- menú del usuario --- */
function userMenu(){
  const admin=YO.rol==='admin';
  const ov=openModal('<div class="modal-head"><div class="ttl"><div class="kicker">'+esc(ROL_TXT[YO.rol]||YO.rol)+'</div><h2>'+esc(YO.nombre)+'</h2><div class="kicker" style="margin:4px 0 0">Usuario: '+esc(YO.usuario)+'</div></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<div class="modal-body menu-list">'+
      '<button type="button" class="menu-i" data-a="clave">Cambiar mi clave</button>'+
      (admin?'<button type="button" class="menu-i" data-a="usuarios">Usuarios</button><button type="button" class="menu-i" data-a="bitacora">Bitácora de cambios</button>':'')+
      '<button type="button" class="menu-i" data-a="salir">Salir del sistema</button></div>',{small:true});
  ov.querySelector('[data-a=clave]').onclick=()=>{closeTop();passwordForm('Cambiar mi clave','',false);};
  ov.querySelector('[data-a=salir]').onclick=logout;
  if(admin){ ov.querySelector('[data-a=usuarios]').onclick=()=>{closeTop();showUsers();}; ov.querySelector('[data-a=bitacora]').onclick=()=>{closeTop();showLog();}; }
}

async function showUsers(){
  let lista; try{ lista=(await api('GET','/api/usuarios')).usuarios; }catch(e){ if(!e.silencioso) alertErr(e); return; }
  const rolSel=(v,dis)=>'<select data-rol'+(dis?' disabled':'')+'>'+Object.keys(ROL_TXT).map(k=>'<option value="'+k+'"'+(k===v?' selected':'')+'>'+ROL_TXT[k]+'</option>').join('')+'</select>';
  const ov=openModal('<div class="modal-head"><div class="ttl"><h2>Usuarios</h2><div class="kicker" style="margin:6px 0 0">Administrador: todo, incluidas tarifas, usuarios y respaldos · Editor: registra y cobra · Solo consulta: busca e imprime</div></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<div class="modal-body"><div class="tbl-wrap"><table class="mini users"><thead><tr><th>Nombre</th><th>Usuario</th><th>Permiso</th><th>Activo</th><th></th></tr></thead><tbody>'+
      lista.map(u=>'<tr data-uid="'+u.id+'"><td><input data-nombre value="'+esc(u.nombre)+'"></td><td>'+esc(u.usuario)+(u.cambiar?' <span class="cellmeta">(clave temporal)</span>':'')+'</td><td>'+rolSel(u.rol)+'</td><td><input type="checkbox" data-activo'+(u.activo?' checked':'')+' aria-label="Activo"></td><td style="white-space:nowrap"><button type="button" class="btn sm" data-save>Guardar</button> <button type="button" class="btn sm" data-reset>Nueva clave</button></td></tr>').join('')+
    '</tbody></table></div>'+
    '<fieldset style="margin-top:16px"><legend>Agregar usuario</legend><div class="grid">'+
      '<div class="field"><label for="nu_n">Nombre completo</label><input id="nu_n"></div>'+
      '<div class="field"><label for="nu_u">Usuario (sin espacios)</label><input id="nu_u" autocapitalize="none" spellcheck="false"></div>'+
      '<div class="field"><label for="nu_r">Permiso</label>'+rolSel('editor').replace('data-rol','id="nu_r"')+'</div>'+
      '<div class="field"><label for="nu_c">Clave temporal (mín. 8)</label><input id="nu_c" autocomplete="off"></div>'+
    '</div><p class="hint">La persona deberá cambiar la clave temporal la primera vez que entre.</p><button type="button" class="btn primary" data-add>Agregar usuario</button></fieldset></div>'+
    '<div class="modal-foot"><button class="btn" data-close type="button">Cerrar</button></div>');
  ov.querySelector('.modal').style.maxWidth='900px';
  const reopen=()=>{closeTop();showUsers();};
  ov.querySelectorAll('tr[data-uid]').forEach(tr=>{
    const id=tr.dataset.uid;
    tr.querySelector('[data-save]').onclick=async()=>{
      try{ await api('PUT','/api/usuarios/'+id,{nombre:tr.querySelector('[data-nombre]').value,rol:tr.querySelector('[data-rol]').value,activo:tr.querySelector('[data-activo]').checked}); toast('Usuario guardado'); reopen(); }
      catch(e){ if(!e.silencioso) alertErr(e); }
    };
    tr.querySelector('[data-reset]').onclick=async()=>{
      const c=prompt('Escriba una clave temporal para este usuario (mínimo 8 caracteres). Deberá cambiarla al entrar.');
      if(!c) return;
      try{ await api('PUT','/api/usuarios/'+id,{clave:c}); toast('Clave temporal asignada'); reopen(); }catch(e){ if(!e.silencioso) alertErr(e); }
    };
  });
  ov.querySelector('[data-add]').onclick=async()=>{
    try{ await api('POST','/api/usuarios',{nombre:ov.querySelector('#nu_n').value,usuario:ov.querySelector('#nu_u').value,rol:ov.querySelector('#nu_r').value,clave:ov.querySelector('#nu_c').value}); toast('Usuario agregado'); reopen(); }
    catch(e){ if(!e.silencioso) alertErr(e); }
  };
}
async function showLog(){
  let b; try{ b=(await api('GET','/api/bitacora')).bitacora; }catch(e){ if(!e.silencioso) alertErr(e); return; }
  const ov=openModal('<div class="modal-head"><div class="ttl"><h2>Bitácora de cambios</h2><div class="kicker" style="margin:6px 0 0">Últimas 300 acciones</div></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<div class="modal-body"><div class="tbl-wrap"><table class="mini"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>'+
    (b.length?b.map(x=>'<tr'+(x.titulo&&STORE[x.titulo]?' class="clic" data-rid="'+esc(x.titulo)+'"':'')+'><td style="white-space:nowrap">'+esc(fmtDT(x.fecha))+'</td><td>'+esc(x.usuario)+'</td><td>'+esc(x.accion)+'</td><td>'+esc(x.detalle)+'</td></tr>').join(''):'<tr><td colspan="4">Sin registros todavía.</td></tr>')+
    '</tbody></table></div></div><div class="modal-foot"><button class="btn" data-close type="button">Cerrar</button></div>');
  ov.querySelector('.modal').style.maxWidth='960px';
  ov.querySelectorAll('[data-rid]').forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.rid));
}

/* --- respaldos --- */
async function bajar(url,nombre){
  try{
    const res=await fetch(url,{credentials:'same-origin'});
    if(!res.ok) throw 0;
    saveBlob(await res.blob(),nombre); toast('Respaldo descargado');
  }catch(e){ confirmBox('No se descargó','<p style="margin:0">No se pudo descargar el respaldo. Intente de nuevo.</p>','Entendido'); }
}
function importFile(){
  return new Promise(res=>{
    const fi=document.createElement('input'); fi.type='file'; fi.accept='.json,application/json';
    fi.onchange=async()=>{
      const f=fi.files[0]; if(!f){res(false);return;}
      let j; try{ j=JSON.parse(await f.text()); if(!j||!j.titulos||typeof j.titulos!=='object') throw 0; }
      catch(e){ await confirmBox('Archivo no válido','<p style="margin:0">El archivo seleccionado no es un respaldo de este sistema.</p>','Entendido'); res(false); return; }
      const n=Object.keys(j.titulos).length;
      const hay=Object.keys(STORE).length;
      if(!await confirmBox('Importar datos','<p style="margin:0">Se cargarán <b>'+n.toLocaleString('es-SV')+'</b> títulos del archivo <b>'+esc(f.name)+'</b>'+(j.fecha?' (guardado el '+esc(fmtDT(j.fecha))+')':'')+'.</p>'+(hay?'<p class="hint" style="margin-bottom:0">Reemplazará los '+hay.toLocaleString('es-SV')+' títulos actuales. Antes se guarda un respaldo automático en el servidor.</p>':''),'Importar',!!hay)){res(false);return;}
      try{ const r=await api('POST','/api/importar',j); toast(r.titulos.toLocaleString('es-SV')+' títulos importados'); await loadAll(); res(true); }
      catch(e){ if(!e.silencioso) alertErr(e); res(false); }
    };
    fi.click();
  });
}
async function showBackup(){
  const admin=YO.rol==='admin';
  let lista=[];
  if(admin){ try{ lista=(await api('GET','/api/respaldos')).respaldos; }catch(e){ if(e.silencioso) return; } }
  const MOT={diario:'automático del día',manual:'manual','antes de importar':'antes de importar','antes de restaurar':'antes de restaurar'};
  const ov=openModal('<div class="modal-head"><div class="ttl"><h2>Respaldos</h2><div class="kicker" style="margin:6px 0 0">'+Object.keys(STORE).length.toLocaleString('es-SV')+' títulos en el servidor</div></div><button class="x" data-close aria-label="Cerrar">'+ICON_X+'</button></div>'+
    '<div class="modal-body">'+
      '<section class="sec" style="margin-bottom:14px"><h3>Cómo se protegen los datos</h3><p style="margin:0 0 6px">Cada cambio se guarda al instante en la base de datos del servidor, y todos los usuarios ven la misma información.</p>'+
      '<p style="margin:0">Cada día, antes del primer cambio, el sistema guarda una copia completa. Se conservan las últimas 40. Además, conviene <b>descargar un respaldo una vez por semana</b> y guardarlo en una memoria USB o en la nube.</p></section>'+
      (admin?'<h3 style="margin:0 0 8px;font-size:14px;font-weight:600;color:var(--accent)">Copias guardadas en el servidor</h3>'+
        (lista.length?'<ul class="rec-list" style="max-height:280px">'+lista.map(b=>'<li><span><strong style="font-weight:600">'+esc(fmtDT(b.fecha))+'</strong><br><span class="cellmeta">'+esc(MOT[b.motivo]||b.motivo)+(b.usuario?' · '+esc(b.usuario):'')+' · '+b.titulos.toLocaleString('es-SV')+' títulos</span></span><span style="display:flex;gap:6px"><button type="button" class="btn sm" data-dl="'+b.id+'" data-f="'+b.fecha+'">Descargar</button><button type="button" class="btn sm" data-rs="'+b.id+'" data-f="'+b.fecha+'">Restaurar</button></span></li>').join('')+'</ul>'
          :'<p class="cellmeta" style="margin:0">Todavía no hay copias. Se creará la primera con el primer cambio del día.</p>'):'')+
    '</div>'+
    '<div class="modal-foot">'+(admin?'<button class="btn left" data-imp type="button">Importar archivo…</button><button class="btn" data-now type="button">Guardar copia ahora</button>':'')+'<button class="btn primary" data-down type="button">Descargar respaldo</button></div>');
  const pad=n=>String(n).padStart(2,'0'), nom=ms=>{const d=new Date(+ms);return 'respaldo_cementerio_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'-'+pad(d.getMinutes())+'.json';};
  ov.querySelector('[data-down]').onclick=()=>bajar('/api/respaldo',nom(Date.now()));
  ov.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>bajar('/api/respaldos/'+b.dataset.dl,nom(b.dataset.f)));
  ov.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{
    if(!await confirmBox('Restaurar copia','<p style="margin:0">Todos los usuarios verán los datos como estaban el <b>'+esc(fmtDT(+b.dataset.f))+'</b>. Antes se guarda una copia de los datos actuales.</p>','Restaurar',true)) return;
    try{ await api('POST','/api/respaldos/'+b.dataset.rs+'/restaurar'); closeTop(); await loadAll(); toast('Copia restaurada'); }catch(e){ if(!e.silencioso) alertErr(e); }
  });
  if(admin){
    ov.querySelector('[data-now]').onclick=async()=>{ try{ await api('POST','/api/respaldos'); toast('Copia guardada'); closeTop(); showBackup(); }catch(e){ if(!e.silencioso) alertErr(e); } };
    ov.querySelector('[data-imp]').onclick=async()=>{ if(await importFile()) closeTop(); };
  }
}
$('#btnBackup').onclick=()=>showBackup();
$('#btnUser').onclick=()=>userMenu();

/* --- arranque --- */
async function loadAll(){
  const d=await api('GET','/api/datos');
  STORE=d.titulos||{}; VERS=d.versiones||{}; SEQ=d.seq||0; REP=repMerge(d.reporte||{});
  ingest(); if(!$('#viewReportes').hidden) repRender();
}
async function start(yo){
  YO=yo;
  canWrite=yo.rol!=='lectura';
  $('#btnNew').disabled=!canWrite; $('#btnNew').hidden=!canWrite;
  $('#btnAjustes').hidden=yo.rol!=='admin';
  $('#btnUser').querySelector('span').textContent=yo.nombre;
  if(yo.cambiar){ forceChangePassword(); return; }
  try{ await loadAll(); }catch(e){ if(!e.silencioso) $('#status').textContent=e.mensaje||'No se pudieron cargar los datos.'; return; }
  clearInterval(pollTimer); pollTimer=setInterval(poll,30000);
  if(location.hash==='#reportes') showView('reportes');
  if(!Object.keys(STORE).length){
    if(yo.rol==='admin'){
      const ov=openModal('<div class="modal-head"><div class="ttl"><h2>Cargar los datos</h2></div></div>'+
        '<div class="modal-body"><p style="margin-top:0">El sistema todavía no tiene títulos. Importe el respaldo más reciente:</p>'+
        '<ul style="margin:0 0 0 18px;padding:0"><li>Del <b>programa instalado</b>: botón Respaldos → Respaldar ahora → Abrir carpeta, y use el archivo más reciente.</li><li>Del <b>archivo HTML</b>: botón Respaldo → Descargar respaldo.</li><li>O el archivo <b>datos_iniciales_cementerio.json</b> (los 1,095 títulos del Excel original).</li></ul></div>'+
        '<div class="modal-foot"><button class="btn" data-close type="button">Ahora no</button><button class="btn primary" data-imp type="button" autofocus>Importar archivo…</button></div>',{small:true});
      ov.querySelector('[data-imp]').onclick=async()=>{ if(await importFile()) closeTop(); };
    } else $('#status').innerHTML='<strong style="color:var(--ink)">Todavía no hay títulos cargados.</strong><br>Pida al administrador que importe los datos.';
  }
}
(async function boot(){
  try{ const yo=await api('GET','/api/yo'); document.body.classList.remove('locked'); await start(yo); }
  catch(e){ if(e.code==='cambiar_clave'&&e.silencioso) return; showLogin(e.code==='no_autenticado'?'':(e.mensaje||'')); }
})();
})();
</script>
